<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DailyFlow · 体验改造概念原型</title>
<style>
:root{--bg:#f5f6f8;--surface:#fff;--muted:#eef0f4;--text:#202638;--secondary:#626b7d;--border:#dbe0e8;--accent:#4658bd;--soft:#eef0fc;--on:#fff;--warning:#92601c;--success:#2b7052;--radius:12px;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 'Segoe UI','Microsoft YaHei UI',sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.5}button,input,select,textarea{color:var(--text)}button{min-height:44px;padding:8px 15px;background:var(--surface);border:1px solid var(--border);border-radius:8px;transition:background .15s}button:hover{background:var(--muted)}button.primary{background:var(--accent);color:var(--on);border-color:var(--accent)}button.primary:hover{filter:brightness(.93)}button.ghost{background:transparent;border-color:transparent}button.selected{background:var(--soft);border-color:var(--accent);color:var(--accent)}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}input,select,textarea{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:9px 12px;min-height:44px;max-width:100%}textarea{width:100%;resize:vertical}label.field{display:grid;gap:6px;color:var(--secondary);font-size:13px}h1,h2,h3,p{margin:0}h1{font-size:28px;font-weight:650;line-height:1.35}h2{font-size:21px;font-weight:600}h3{font-size:15px;font-weight:600}small,.muted{color:var(--secondary)}small{font-size:12px}.top{height:55px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;padding:0 24px;background:var(--surface);gap:12px}.brand{font-size:18px;font-weight:700;letter-spacing:-.6px}.demo{font-size:12px;color:var(--secondary)}.shell{display:grid;grid-template-columns:180px minmax(0,1fr);min-height:calc(100vh - 55px)}aside.nav{padding:26px 15px;border-right:1px solid var(--border);background:var(--surface)}.nav button{width:100%;text-align:left;border-color:transparent;margin-bottom:7px;background:transparent}.nav button[aria-current=page]{background:var(--soft);color:var(--accent);font-weight:600}.nav .foot{margin-top:48px;font-size:12px;padding:12px;color:var(--secondary)}main{padding:32px 36px 80px;min-width:0}.pagehead{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:28px}.pagehead p{margin-top:7px}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pill{font-size:12px;color:var(--accent);background:var(--soft);border-radius:20px;padding:4px 10px;display:inline-block}.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}.section{padding:24px}.rule{border:0;border-top:1px solid var(--border);margin:22px 0}.tabs{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}.tabs button{background:transparent}.layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:24px}.next{padding:21px;background:var(--soft);border-left:3px solid var(--accent);margin-bottom:22px}.next p{margin:8px 0 16px}.stat{display:grid;gap:7px}.stat strong{font-size:26px;font-variant-numeric:tabular-nums}.capacity{height:7px;background:var(--muted);border-radius:8px;margin:15px 0}.capacity span{display:block;height:100%;width:72%;background:var(--accent);border-radius:8px}.side-section{margin-bottom:26px}.side-section p{margin:10px 0}.gantt-scroll{overflow-x:auto;border-radius:var(--radius)}.gantt{min-width:690px;background:var(--surface)}.gantt-head,.gantt-row{display:grid;grid-template-columns:230px minmax(420px,1fr)}.gantt-head{border-bottom:1px solid var(--border);color:var(--secondary);font-size:12px;min-height:45px;align-items:center}.gantt-head>span{padding-left:17px}.weeks{display:grid;grid-template-columns:repeat(4,1fr);height:45px;align-items:center;text-align:center}.gantt-row{min-height:58px;border-bottom:1px solid var(--border)}.gantt-row:last-child{border-bottom:0}.row-title{display:flex;align-items:center;padding:10px 16px;gap:9px;min-width:0}.row-title.child{padding-left:34px;font-size:13px}.row-title button{min-height:40px;padding:0;text-align:left;background:transparent;border:0;line-height:1.45}.track{position:relative;background:repeating-linear-gradient(to right,transparent 0,transparent calc(25% - 1px),var(--border) calc(25% - 1px),var(--border) 25%)}.today-line{position:absolute;top:0;bottom:0;left:16.07%;border-left:2px solid var(--accent);opacity:.45;pointer-events:none}.bar{position:absolute;top:13px;height:31px;min-height:31px;border:0;padding:4px 9px;border-radius:5px;background:var(--soft);color:var(--accent);overflow:hidden;white-space:nowrap;font-size:12px;min-width:30px;text-align:left}.bar:hover{background:var(--accent);color:var(--on)}.bar.done{background:var(--muted);color:var(--secondary)}.bar.parent{height:12px;min-height:12px;top:23px;background:var(--accent);padding:0;opacity:.7}.diamond{position:absolute;top:22px;width:15px;height:15px;transform:rotate(45deg);background:var(--accent)}.legend{display:flex;gap:20px;flex-wrap:wrap;font-size:12px;color:var(--secondary);padding:15px 2px}.list-row{display:flex;align-items:center;gap:13px;padding:18px 0;border-bottom:1px solid var(--border)}.list-row:last-child{border-bottom:0}.list-row .grow{flex:1;min-width:0}.list-row input[type=checkbox]{width:20px;height:20px;min-height:20px;accent-color:var(--accent)}.list-row strong{display:block;font-weight:550}.progress{height:6px;background:var(--muted);border-radius:5px;overflow:hidden}.progress>span{display:block;width:40%;height:100%;background:var(--accent)}.focus-wrap{max-width:880px;margin:auto}.focus-card{padding:36px 48px}.focus-title{font-size:30px;max-width:600px;margin:14px 0 8px}.focus-context{margin-bottom:25px}.focus-choice{display:flex;gap:8px;margin-bottom:24px}.focus-mode{display:flex;align-items:end;gap:14px;flex-wrap:wrap;margin:24px 0}.focus-mode label:first-child{min-width:165px}.focus-mode input{width:95px}.intent{margin:20px 0}.begin{width:100%;margin-top:18px;min-height:48px}.focus-recommend{display:flex;justify-content:space-between;gap:18px;align-items:center;padding:18px 0;border-bottom:1px solid var(--border)}.focus-recommend strong{font-weight:550}.running{text-align:center;padding:36px}.clock{font-size:76px;font-weight:400;font-variant-numeric:tabular-nums;letter-spacing:-3px;line-height:1.15}.dial{width:250px;height:250px;position:relative;margin:22px auto}.dial svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}.dial .timebox{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column}.dial .clock{font-size:54px}.running .actions{justify-content:center}.step-strip{display:flex;justify-content:center;gap:16px;margin:28px 0;color:var(--secondary);font-size:13px;flex-wrap:wrap}.step-strip .current{color:var(--accent);font-weight:600}.focus-capture{text-align:left;margin:32px auto 0;max-width:600px}.history{margin-top:24px}.history summary{cursor:pointer;padding:17px 0;color:var(--secondary)}.inbox-layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:32px}.capture{display:flex;gap:10px}.capture input{flex:1;min-width:0}.inbox-count{margin:22px 0 5px}.process-panel{align-self:start;padding:24px;position:sticky;top:24px}.process-panel .field{margin-top:16px}.process-panel h2{font-size:18px}.process-buttons{display:grid;gap:10px;margin-top:22px}.detail-layout{display:grid;grid-template-columns:minmax(0,1fr) 275px;gap:0;overflow:hidden}.detail-main{padding:30px 32px}.detail-meta{padding:30px 24px;border-left:1px solid var(--border);background:var(--bg)}.detail-meta .field{margin-bottom:20px}.title-input{font-size:25px;font-weight:600;width:100%;border-color:transparent;padding:4px 0;background:transparent}.title-input:hover{border-color:var(--border)}.detail-main .actions{margin:18px 0 26px}.detail-main h3{margin:24px 0 12px}.checkrow{display:flex;align-items:center;gap:10px;margin:14px 0}.checkrow input{accent-color:var(--accent);min-height:20px;width:18px;height:18px}.detail-meta details{margin-top:26px}.detail-meta summary{cursor:pointer}.settings{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 5px 22px #00000012;z-index:5;max-width:calc(100vw - 24px)}.settings select{font-size:13px;padding:4px 8px;min-height:36px}.settings button{min-height:36px;padding:4px 10px;font-size:13px}.settings small{white-space:nowrap}.toast{position:fixed;bottom:88px;right:30px;max-width:calc(100vw - 48px);background:var(--text);color:var(--surface);padding:13px 20px;border-radius:10px;z-index:10;font-size:13px}.empty{padding:45px;text-align:center}.dialog{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:16px;padding:28px;width:min(470px,calc(100vw - 32px));max-height:85vh;overflow:auto}.dialog::backdrop{background:#0006}.dialog h2{margin-bottom:15px}.dialog .field{margin:16px 0}.dialog .actions{margin-top:22px}.save-state{font-size:12px;min-height:20px;color:var(--secondary)}[hidden]{display:none!important}.notice{font-size:12px;color:var(--secondary);margin-top:24px}
html[data-style=paper]{--bg:#f3f1ec;--surface:#fffdf8;--muted:#e9e5dc;--border:#d6d0c4;--text:#30322f;--secondary:#67675d;--accent:#6b604c;--soft:#ede8de;--radius:6px}
html[data-style=forest]{--bg:#f2f6f3;--surface:#fcfefd;--muted:#e8efeb;--border:#d1dfd7;--text:#243d32;--secondary:#5f7569;--accent:#326c53;--soft:#e7f1eb;--radius:12px}
html[data-style=graphite]{--bg:#f0f1f2;--surface:#fff;--muted:#e6e8eb;--border:#cdd1d6;--text:#24282c;--secondary:#63676c;--accent:#414a57;--soft:#e8ebf0;--radius:4px}
html[data-dark=true]{--bg:#191d24;--surface:#222832;--muted:#2d3542;--border:#414c5c;--text:#eef1f6;--secondary:#b1bac9;--accent:#b0baff;--soft:#30395b;--on:#1e2540;color-scheme:dark}
html[data-dark=true][data-style=forest]{--bg:#17231d;--surface:#203027;--muted:#2a3d32;--border:#456052;--text:#ebf6ef;--secondary:#b3cbbd;--accent:#aad5b8;--soft:#304c3b;--on:#193523}
html[data-dark=true][data-style=paper]{--bg:#25241f;--surface:#302e28;--muted:#3a382f;--border:#565346;--text:#f5f1e5;--secondary:#cbc5b3;--accent:#e0cfa8;--soft:#48412f;--on:#302a1b}
html[data-dark=true][data-style=graphite]{--bg:#1c1e21;--surface:#282b2f;--muted:#34383e;--border:#51565e;--text:#f2f3f5;--secondary:#babec5;--accent:#c5cedc;--soft:#3b4350;--on:#262c35}
@media(max-width:1100px){main{padding:26px 24px 85px}.shell{grid-template-columns:140px minmax(0,1fr)}.layout{grid-template-columns:minmax(0,1fr)}.road-aside{display:grid;grid-template-columns:1fr 1fr;gap:24px}.inbox-layout{grid-template-columns:minmax(0,1fr) 260px}.detail-layout{grid-template-columns:minmax(0,1fr) 240px}}
@media(max-width:760px){.shell{display:block}.nav{display:flex;overflow:auto;border-right:0!important;padding:8px!important;border-bottom:1px solid var(--border)}.nav button{width:auto;white-space:nowrap;margin:0}.nav .foot{display:none}.top{padding:0 16px}.demo{max-width:180px;text-align:right;font-size:11px}main{padding:24px 16px 100px}.pagehead{align-items:flex-start;flex-direction:column;gap:14px}h1{font-size:25px}.inbox-layout,.detail-layout{grid-template-columns:minmax(0,1fr)}.detail-meta{border-left:0;border-top:1px solid var(--border)}.focus-card{padding:24px}.focus-title{font-size:25px}.road-aside{grid-template-columns:1fr}.running{padding:24px 14px}.settings small{display:none}.process-panel{position:static}.list-row{flex-wrap:wrap}.list-row .actions{margin-left:32px}.gantt-head,.gantt-row{grid-template-columns:210px minmax(420px,1fr)}.detail-main{padding:24px}.focus-choice{flex-wrap:wrap}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="top"><span class="brand">DailyFlow</span><span class="demo">概念原型 · 示例数据 · 仅在内存中操作</span></header>
<div class="shell">
<aside class="nav" aria-label="页面导航"><button data-page="roadmap" aria-current="page">长期规划</button><button data-page="detail">任务详情</button><button data-page="focus">专注</button><button data-page="inbox">收集箱 <span id="nav-count">4</span></button><div class="foot">从方向到行动<br>让每一步都看得见</div></aside>
<main id="workspace"></main>
</div>
<div class="settings" aria-label="外观预览"><small>同一布局，四种风格</small><select id="style" aria-label="外观风格"><option value="default">经典靛蓝</option><option value="paper">纸感</option><option value="forest">森林</option><option value="graphite">石墨</option></select><button id="dark" aria-pressed="false">切换深色</button></div>
<div class="toast" id="toast" role="status" hidden></div>
<dialog id="date-dialog" class="dialog" aria-labelledby="date-title"><form id="date-form"><h2 id="date-title">调整任务日期</h2><p id="date-task"></p><label class="field">计划开始<input id="range-start" type="date" required></label><label class="field">计划结束<input id="range-end" type="date" required></label><p id="date-error" role="alert"></p><div class="actions"><button type="button" id="date-close">取消</button><button class="primary">应用日期</button></div><p class="notice">改动仅用于预览，不自动移动其他任务。</p></form></dialog>
<dialog id="finish-dialog" class="dialog" aria-labelledby="finish-title"><form id="finish-form"><h2 id="finish-title">保存这次投入</h2><p id="finish-summary"></p><label class="field">本次进展（可选）<textarea id="finish-note" rows="3" placeholder="做到哪里了？"></textarea></label><label class="field">下一步（可选）<input id="finish-next" placeholder="下次从哪里开始？"></label><label class="checkrow" id="complete-wrap"><input type="checkbox" id="complete-task">同时完成关联任务</label><div class="actions"><button type="button" id="finish-close">返回计时</button><button class="primary">保存投入</button></div></form></dialog>
<script>
// Throwaway experience concept, fictional data; no network, storage, or DailyFlow database access.
const root=document.getElementById('workspace');
const state={page:'roadmap',view:'gantt',target:'task',mode:'countdown',goal:25,intent:'把 3 个关键发现整理成提纲',status:'idle',seconds:0,since:null,note:'',history:[],selected:new Set(),inbox:[{id:1,title:'整理下一阶段的学习资料',source:'快捷收集 · 今天'},{id:2,title:'试试用周复盘整理进度',source:'手动记录 · 昨天'},{id:3,title:'周末备份项目文件',source:'快捷收集 · 10 月 7 日'},{id:4,title:'新课程的想法',source:'手动记录 · 10 月 6 日'}],task:{title:'整理调研发现，写出报告提纲',date:'2026-10-09',estimate:45,notes:'交付标准：整理 3 个关键发现，每个发现附一条来源，形成可开始写作的提纲。',completed:false},schedule:[{id:1,title:'资料与方向确认',start:'2026-10-05',end:'2026-10-10',done:false,parent:true},{id:2,title:'收集参考资料',start:'2026-10-05',end:'2026-10-08',done:true},{id:3,title:'整理调研发现',start:'2026-10-09',end:'2026-10-10',done:false},{id:4,title:'形成报告初稿',start:'2026-10-11',end:'2026-10-20',done:false,parent:true},{id:5,title:'写作与补充案例',start:'2026-10-11',end:'2026-10-17',done:false},{id:6,title:'修订并完成交付',start:'2026-10-21',end:'2026-10-28',done:false,parent:true}],editing:null};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const day=s=>Math.floor(Date.parse(s+'T00:00:00Z')/86400000),base=day('2026-10-05');
function toast(s){document.getElementById('toast').textContent=s;document.getElementById('toast').hidden=false;clearTimeout(state.toastTimer);state.toastTimer=setTimeout(()=>document.getElementById('toast').hidden=true,3500)}
function go(page){state.page=page;document.querySelectorAll('[data-page]').forEach(b=>{if(b.dataset.page===page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});render();window.scrollTo(0,0)}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));
document.getElementById('style').onchange=e=>document.documentElement.dataset.style=e.target.value;
document.getElementById('dark').onclick=e=>{const dark=document.documentElement.dataset.dark!=='true';document.documentElement.dataset.dark=dark;e.currentTarget.setAttribute('aria-pressed',String(dark));e.currentTarget.textContent=dark?'切换浅色':'切换深色'};
function roadmap(){return `<div class="pagehead"><div><h1>长期规划</h1><p class="muted">看清阶段，再决定今天推进什么。</p></div><span class="pill">示例计划：完成研究报告</span></div><div class="tabs" role="group" aria-label="规划视图"><button data-view="gantt" class="${state.view==='gantt'?'selected':''}">甘特图</button><button data-view="list" class="${state.view==='list'?'selected':''}">任务列表</button></div><div class="layout"><div><div class="next"><small>本周下一步</small><h2>${esc(state.task.title)}</h2><p class="muted">资料与方向确认 / 预计 ${state.task.estimate} 分钟</p><div class="actions"><button class="primary" data-go-focus>开始专注</button><button data-go-detail>查看与编辑</button></div></div>${state.view==='gantt'?gantt():`<div class="panel section">${state.schedule.map(r=>`<div class="list-row"><div class="grow"><strong>${esc(r.title)}</strong><small>${r.start} 至 ${r.end}</small></div><button data-range="${r.id}">调整日期</button></div>`).join('')}</div>`}<p class="notice">日期为 2026 年 10 月 5 日至 11 月 1 日；“今天”为演示日期 10 月 9 日。点击条形或任务名，可预览日期调整。</p></div><aside class="road-aside"><section class="side-section"><h3>成果进度</h3><div class="stat"><strong>1 / 4 项</strong><span class="muted">按执行任务完成数</span></div><div class="capacity"><span style="width:25%"></span></div><p class="muted">时间投入单独记录，不作为成果完成率。</p></section><section class="side-section"><h3>本周容量</h3><div class="stat"><strong>3.5 / 5 小时</strong><span class="muted">已承诺 / 可投入</span></div><div class="capacity"><span style="width:70%"></span></div><p class="muted">还可安排 1.5 小时，保留调整空间。</p></section><section class="side-section"><h3>尚未排期</h3><p>收集读者反馈</p><button id="schedule-feedback">安排日期</button></section></aside></div>`}
function gantt(){return `<div class="panel gantt-scroll"><div class="gantt" role="group" aria-label="研究报告甘特图，包含三个阶段和三个执行任务"><div class="gantt-head"><span>计划 / 阶段 / 执行任务</span><div class="weeks"><span>10.05 — 10.11</span><span>10.12 — 10.18</span><span>10.19 — 10.25</span><span>10.26 — 11.01</span></div></div>${state.schedule.map(r=>{const left=Math.max(0,(day(r.start)-base)/28*100),width=Math.min(100-left,(day(r.end)-day(r.start)+1)/28*100);return `<div class="gantt-row"><div class="row-title ${r.parent?'':'child'}"><span class="muted">${r.parent?'›':r.done?'✓':'·'}</span><button data-range="${r.id}">${esc(r.title)}</button></div><div class="track"><span class="today-line"></span><button data-range="${r.id}" aria-label="${esc(r.title)}，${r.start} 至 ${r.end}，${r.done?'已完成':'调整日期'}" class="bar ${r.done?'done':''} ${r.parent?'parent':''}" style="left:${left}%;width:${width}%">${r.parent?'':r.done?'已完成':'计划'}</button></div></div>`}).join('')}<div class="gantt-row"><div class="row-title"><span class="muted">◆</span>报告交付</div><div class="track"><span class="today-line"></span><span class="diamond" style="left:82.14%" role="img" aria-label="报告交付里程碑，10 月 28 日"></span></div></div></div></div><div class="legend"><span>粗线：阶段</span><span>细条：任务日期</span><span>◆ 里程碑</span><span>竖线：今天</span></div>`}
function detail(){return `<div class="pagehead"><div><h1>任务详情</h1><p class="muted">查看、修改和开始，都在同一个地方。</p></div><button data-go-roadmap>返回长期规划</button></div><div class="panel detail-layout"><div class="detail-main"><small>研究报告 / 资料与方向确认 / 执行任务</small><label class="field" style="margin-top:12px"><span class="sr">任务名称</span><input id="task-title" class="title-input" value="${esc(state.task.title)}"></label><div class="actions"><button class="primary" data-go-focus ${state.task.completed?'disabled':''}>开始专注</button><button id="mark-complete">${state.task.completed?'恢复为待办':'标记完成'}</button><span class="save-state" id="save-state">示例修改仅保存在内存</span></div><h3>说明与完成标准</h3><label class="field">任务说明<textarea id="task-notes" rows="5">${esc(state.task.notes)}</textarea></label><h3>执行清单</h3><label class="checkrow"><input type="checkbox" checked>汇总 3 个关键发现</label><label class="checkrow"><input type="checkbox">为每个发现补充来源</label><label class="checkrow"><input type="checkbox">形成可写作的提纲</label><hr class="rule"><details><summary>投入记录</summary><p class="muted" style="margin-top:14px">示例：昨天投入 30 分钟，记录 1 次。时间投入与成果完成分开呈现。</p></details></div><aside class="detail-meta"><h3 style="margin-bottom:22px">安排与归属</h3><label class="field">安排到<input id="task-date" type="date" value="${state.task.date}"></label><label class="field">预计投入（分钟）<input id="task-estimate" type="number" min="1" max="1440" value="${state.task.estimate}"></label><label class="field">优先级<select><option>普通</option><option>重要</option></select></label><label class="field">所属阶段<select><option>资料与方向确认</option><option>形成报告初稿</option><option>修订并完成交付</option></select></label><details><summary>更多属性</summary><p class="muted" style="margin-top:12px">重复、分类、创建时间与扩展操作放在这里。</p></details><p class="notice">当前示例用于评估信息层级，属性编辑不写入真实任务。</p></aside></div>`}
function elapsed(){return state.seconds+(state.status==='running'?(Date.now()-state.since)/1000:0)}
function time(n){n=Math.max(0,Math.floor(n));return (n>=3600?Math.floor(n/3600)+':':'')+String(Math.floor(n/60)%60).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function focus(){return `<div class="focus-wrap"><div class="pagehead"><div><h1>专注</h1><p class="muted">${state.status==='idle'?'选一个动作，给它一段时间。':'把注意力留给眼前这件事。'}</p></div><span class="pill">${state.status==='idle'?'准备开始':state.status==='paused'?'已暂停':'正在专注'}</span></div><div class="panel">${state.status==='idle'?focusIdle():focusRunning()}</div><details class="history"><summary>投入记录 · ${state.history.length} 条</summary>${state.history.length?state.history.map(r=>`<div class="list-row"><div class="grow"><strong>${esc(r.title)}</strong><small>${esc(r.note||'未填写备注')}${r.next?' / 下一步：'+esc(r.next):''}</small></div><span>${time(r.seconds)}</span></div>`).join(''):'<p class="muted">完成本次计时后，记录会出现在这里。</p>'}</details></div>`}
function focusIdle(){return `<div class="focus-card"><div class="focus-choice" role="group" aria-label="专注对象"><button data-target="task" class="${state.target==='task'?'selected':''}" aria-pressed="${state.target==='task'}">关联任务</button><button data-target="free" class="${state.target==='free'?'selected':''}" aria-pressed="${state.target==='free'}">无任务计时</button></div>${state.target==='task'?`<small>本周下一步</small><h2 class="focus-title">${esc(state.task.title)}</h2><p class="focus-context muted">研究报告 / 资料与方向确认</p><button class="ghost" data-go-detail>查看任务说明</button>`:'<h2 class="focus-title">现在就开始</h2><p class="muted">不用先建任务，时间会保留在投入记录中。</p>'}<label class="field intent">本次想推进什么（可选）<input id="intent" value="${esc(state.intent)}" placeholder="一句话写下这次的动作"></label><div class="focus-mode"><label class="field">计时方式<select id="mode"><option value="stopwatch" ${state.mode==='stopwatch'?'selected':''}>正计时</option><option value="countdown" ${state.mode==='countdown'?'selected':''}>倒计时</option><option value="pomodoro" ${state.mode==='pomodoro'?'selected':''}>番茄钟</option></select></label>${state.mode!=='stopwatch'?`<label class="field">目标分钟<input id="goal" type="number" min="1" max="180" value="${state.goal}"></label>`:''}<span class="muted">${state.mode==='pomodoro'?'单段专注，结束后休息':state.mode==='countdown'?'到时提醒，可继续计时':'随时结束，按实际投入记录'}</span></div><button id="begin" class="primary begin">${state.target==='free'?'开始无任务计时':'开始专注'}</button></div>`}
function focusRunning(){return `<div class="running"><p class="muted" id="session-state">${state.status==='paused'?'暂停期间不累计投入':'本次意图'}</p><h2 class="focus-title" style="margin-left:auto;margin-right:auto">${esc(state.intent||state.sessionTitle)}</h2><p class="muted">${esc(state.sessionTitle)}</p><div class="dial"><svg viewBox="0 0 240 240" aria-hidden="true"><circle cx="120" cy="120" r="109" fill="none" stroke="var(--muted)" stroke-width="5"/><circle id="ring" cx="120" cy="120" r="109" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" stroke-dasharray="684.87" stroke-dashoffset="684.87"/></svg><div class="timebox"><span class="clock" id="clock">00:00</span><small id="clock-caption">${state.mode==='stopwatch'?'已投入':'剩余目标时间'}</small></div></div><div class="actions"><button class="primary" id="pause">${state.status==='paused'?'继续专注':'暂停'}</button><button id="finish">结束并记录</button></div>${state.target==='task'?'<div class="step-strip"><span>✓ 收集资料</span><span class="current">当前：整理发现</span><span>下一步：形成初稿</span></div>':'<p class="muted" style="margin-top:24px">本次时间保存在无任务投入记录中</p>'}<details class="focus-capture"><summary>随手记，不离开当前专注</summary><label class="field" style="margin-top:12px">备注<textarea id="session-note" rows="3">${esc(state.note)}</textarea></label></details><p class="notice">圆环显示计时进度，不代表任务成果完成率。</p></div>`}
function tick(){const clock=document.getElementById('clock');if(!clock)return;const n=elapsed(),total=state.goal*60,progress=state.mode==='stopwatch'?0:Math.min(1,n/total);clock.textContent=time(state.mode==='stopwatch'||n>=total?n:total-n);document.getElementById('ring').style.strokeDashoffset=String(684.87*(1-progress));document.getElementById('clock-caption').textContent=state.mode==='stopwatch'?'已投入':n>=total?'目标已达到 · 已投入':'剩余目标时间'}
function inbox(){return `<div class="pagehead"><div><h1>收集箱</h1><p class="muted">先记下来。整理时，再决定放到哪里。</p></div><span class="pill">${state.inbox.length} 条待整理</span></div><div class="inbox-layout"><section><form id="capture" class="capture"><input id="capture-title" aria-label="快速收集" placeholder="记下一个想法或待办…" required><button class="primary">收集</button></form><p class="inbox-count muted">待整理</p>${state.inbox.length?state.inbox.map(r=>`<div class="list-row"><input type="checkbox" data-inbox="${r.id}" aria-label="选择${esc(r.title)}" ${state.selected.has(r.id)?'checked':''}><div class="grow"><strong>${esc(r.title)}</strong><small>${esc(r.source)}</small></div><button data-select="${r.id}">整理</button></div>`).join(''):'<div class="empty"><h2>收集箱已整理完</h2><p class="muted">下次有想法，直接记在这里。</p></div>'}</section><aside class="panel process-panel"><h2>整理所选 ${state.selected.size} 条</h2><p class="muted" style="margin-top:8px">每条想法都有明确去处。</p><label class="field">安排日期<input type="date" id="inbox-date" value="2026-10-09"></label><div class="process-buttons"><button class="primary" data-process="安排为任务" ${!state.selected.size?'disabled':''}>安排为任务</button><button data-process="加入长期计划" ${!state.selected.size?'disabled':''}>加入长期计划</button><button data-process="保存为笔记" ${!state.selected.size?'disabled':''}>保存为笔记</button><button data-process="归档" ${!state.selected.size?'disabled':''}>归档</button></div><p class="notice">示例展示整理流程。真实实现需保留转换来源、防重复与撤销。</p></aside></div>`}
function render(){root.innerHTML=({roadmap,detail,focus,inbox}[state.page])();document.getElementById('nav-count').textContent=state.inbox.length;root.querySelectorAll('[data-go-focus]').forEach(b=>b.onclick=()=>{state.target='task';go('focus')});root.querySelectorAll('[data-go-detail]').forEach(b=>b.onclick=()=>go('detail'));root.querySelectorAll('[data-go-roadmap]').forEach(b=>b.onclick=()=>go('roadmap'));root.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;render()});root.querySelectorAll('[data-range]').forEach(b=>b.onclick=()=>editRange(Number(b.dataset.range)));const feedback=document.getElementById('schedule-feedback');if(feedback)feedback.onclick=()=>{state.schedule.push({id:7,title:'收集读者反馈',start:'2026-10-29',end:'2026-10-30',done:false});feedback.disabled=true;editRange(7)};if(state.page==='detail')wireDetail();if(state.page==='focus')wireFocus();if(state.page==='inbox')wireInbox();tick()}
function wireDetail(){const save=()=>{document.getElementById('save-state').textContent='已应用到示例 · 未写入 DailyFlow'};document.getElementById('task-title').onchange=e=>{const title=e.target.value.trim();if(!title){e.target.value=state.task.title;return}state.task.title=title;save()};document.getElementById('task-notes').onchange=e=>{state.task.notes=e.target.value;save()};document.getElementById('task-date').onchange=e=>{state.task.date=e.target.value;save()};document.getElementById('task-estimate').onchange=e=>{if(e.target.validity.valid){state.task.estimate=Number(e.target.value);save()}};document.getElementById('mark-complete').onclick=()=>{state.task.completed=!state.task.completed;render();toast(state.task.completed?'示例任务已完成':'示例任务已恢复')}}
function wireFocus(){if(state.status==='idle'){root.querySelectorAll('[data-target]').forEach(b=>b.onclick=()=>{state.target=b.dataset.target;render()});document.getElementById('intent').oninput=e=>state.intent=e.target.value;document.getElementById('mode').onchange=e=>{state.mode=e.target.value;render()};const goal=document.getElementById('goal');if(goal)goal.oninput=e=>state.goal=Number(e.target.value);document.getElementById('begin').onclick=()=>{if(state.mode!=='stopwatch'&&(!Number.isFinite(state.goal)||state.goal<1||state.goal>180)){toast('请输入 1 至 180 分钟');return}state.status='running';state.seconds=0;state.since=Date.now();state.sessionTitle=state.target==='task'?state.task.title:'无任务计时';render()}}else{document.getElementById('pause').onclick=()=>{if(state.status==='running'){state.seconds=elapsed();state.since=null;state.status='paused'}else{state.since=Date.now();state.status='running'}render()};document.getElementById('session-note').oninput=e=>state.note=e.target.value;document.getElementById('finish').onclick=()=>{state.beforeFinish=state.status;if(state.status==='running'){state.seconds=elapsed();state.since=null;state.status='paused'}document.getElementById('finish-summary').textContent=state.sessionTitle+' · '+time(state.seconds);document.getElementById('finish-note').value=state.note;document.getElementById('complete-wrap').hidden=state.target==='free';document.getElementById('complete-task').checked=false;document.getElementById('finish-dialog').showModal();render()}}}
function wireInbox(){document.getElementById('capture').onsubmit=e=>{e.preventDefault();const title=document.getElementById('capture-title').value.trim();if(!title)return;state.inbox.unshift({id:Date.now(),title,source:'快捷收集 · 刚刚'});render();document.getElementById('capture-title').focus();toast('已收集到示例收集箱')};root.querySelectorAll('[data-inbox]').forEach(b=>b.onchange=()=>{const id=Number(b.dataset.inbox);if(b.checked)state.selected.add(id);else state.selected.delete(id);render()});root.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>{state.selected=new Set([Number(b.dataset.select)]);render();document.getElementById('inbox-date').focus()});root.querySelectorAll('[data-process]').forEach(b=>b.onclick=()=>{const count=state.selected.size,operation=b.dataset.process;state.inbox=state.inbox.filter(r=>!state.selected.has(r.id));state.selected.clear();render();toast(`${count} 条已${operation}（流程演示）`)})}
function editRange(id){state.editing=id;const row=state.schedule.find(r=>r.id===id);document.getElementById('date-task').textContent=row.title;document.getElementById('range-start').value=row.start;document.getElementById('range-end').value=row.end;document.getElementById('date-error').textContent='';document.getElementById('date-dialog').showModal()}
document.getElementById('date-close').onclick=()=>document.getElementById('date-dialog').close();
document.getElementById('date-form').onsubmit=e=>{e.preventDefault();const start=document.getElementById('range-start').value,end=document.getElementById('range-end').value;if(start>end){document.getElementById('date-error').textContent='结束日期不能早于开始日期';return}if(day(start)<base||day(end)>base+27){document.getElementById('date-error').textContent='本原型支持 10 月 5 日至 11 月 1 日范围内的调整';return}const row=state.schedule.find(r=>r.id===state.editing);row.start=start;row.end=end;document.getElementById('date-dialog').close();render();toast('示例日期已调整，其他任务日期保持原值')};
function cancelFinish(){document.getElementById('finish-dialog').close();if(state.beforeFinish==='running'){state.since=Date.now();state.status='running'}render()}
document.getElementById('finish-close').onclick=cancelFinish;document.getElementById('finish-dialog').oncancel=e=>{e.preventDefault();cancelFinish()};
document.getElementById('finish-form').onsubmit=e=>{e.preventDefault();state.history.unshift({title:state.sessionTitle,seconds:state.seconds,note:document.getElementById('finish-note').value,next:document.getElementById('finish-next').value});if(state.target==='task'&&document.getElementById('complete-task').checked)state.task.completed=true;state.status='idle';state.seconds=0;state.since=null;state.note='';document.getElementById('finish-next').value='';document.getElementById('finish-dialog').close();render();toast('投入已保存到示例记录')};
setInterval(tick,250);render();
</script>
</body>
</html>
