[package]
name = "dailyflow"
version = "1.9.0"
description = "DailyFlow - 个人本地时间管理工具"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dailyflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-notification = "2"
# 单实例保护：重复启动时聚焦已有窗口，不新建第二个进程/窗口
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_System_Com"] }
# 专注完成原生桌面通知（与 tauri-plugin-notification 共用同一版本，无新增传递依赖）
notify-rust = "4"
# 仅用于启动自诊断：探测 WebView2 加载器将使用的运行时版本
webview2-com-sys = "0.38"
webview2-com = "0.38"
windows-core = "0.61"
