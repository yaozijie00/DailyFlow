[package]
name = "dailyflow"
version = "1.3.0"
description = "DailyFlow - 个人本地时间管理工具"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dailyflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_System_Com"] }
# 新闻源抓取（RSS，阻塞调用在 spawn_blocking 中执行）与系统浏览器打开外链
ureq = "2"
open = "5"
# 仅用于启动自诊断：探测 WebView2 加载器将使用的运行时版本
webview2-com-sys = "0.38"
webview2-com = "0.38"
windows-core = "0.61"
